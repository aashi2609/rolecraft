# CI-equivalent check for migration safety + unit/isolation tests.
# Deploy Python pin: 3.11.9 (Render runtime.txt / render.yaml).
name: API CI

on:
  push:
    paths:
      - "apps/api/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/api-ci.yml"

defaults:
  run:
    working-directory: apps/api

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector image — required for Resume.embedding vector(1536)
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rolecraft_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rolecraft_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: development
      JWT_SECRET: ci-test-secret-must-be-at-least-32-chars-long
      CORS_ORIGINS: http://localhost:3000
      RATE_LIMIT_ENABLED: "false"
      # Isolated DB — never the primary Neon endpoint denylist
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/rolecraft_test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/rolecraft_test
      PRIMARY_DATABASE_URL: postgresql+asyncpg://neondb_owner:x@ep-fragrant-salad-aybt4nuh-pooler.c-5.us-east-2.aws.neon.tech/neondb
      ALLOW_PRIMARY_MIGRATIONS: "0"
      ALLOW_DESTRUCTIVE_DOWNGRADE: "0"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Show interpreter
        run: |
          pwd
          python --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Enable pgvector
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d rolecraft_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Alembic single head
        run: |
          export PYTHONPATH=.
          heads=$(alembic heads)
          echo "$heads"
          echo "$heads" | wc -l | grep -q '^ *1$'

      - name: Alembic upgrade head (empty DB)
        run: |
          export PYTHONPATH=.
          alembic upgrade head

      - name: Alembic check (no drift)
        run: |
          export PYTHONPATH=.
          alembic check

      - name: Pytest (isolation + unit + migrations)
        run: |
          export PYTHONPATH=.
          python -m pytest tests/ -q --tb=line
