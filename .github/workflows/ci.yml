name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python 3.11.9)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg15-latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Print Python version and working directory
        run: |
          python --version
          pwd

      - name: Install dependencies
        run: |
          cd apps/api
          pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          cd apps/api
          ruff check .

      - name: Format check with ruff
        run: |
          cd apps/api
          ruff format --check .

      - name: Type check with mypy (non-blocking)
        continue-on-error: true
        run: |
          cd apps/api
          mypy . --ignore-missing-imports || true

      - name: Security audit with pip-audit
        run: |
          cd apps/api
          pip-audit --desc

      - name: Set up test database
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          cd apps/api
          psql -c "CREATE DATABASE test_isolated;"

      - name: Run Alembic check
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_isolated
        run: |
          cd apps/api
          alembic check

      - name: Run migrations on test database
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_isolated
        run: |
          cd apps/api
          alembic upgrade head

      - name: Run pytest with coverage
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_isolated
          STORAGE_BACKEND: local
          RATE_LIMIT_ENABLED: 'false'
        run: |
          cd apps/api
          pytest tests/ -v --tb=short --durations=15 \
            --cov=. --cov-report=xml --cov-report=term-missing \
            --junit-xml=junit.xml 2>&1 | tee test_output.log

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./apps/api/coverage.xml
          flags: backend
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: backend-test-results
          path: |
            apps/api/junit.xml
            apps/api/test_output.log
            apps/api/coverage.xml

  frontend:
    name: Frontend (Node 20.11.1)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20.11.1
        uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint with ESLint
        run: npm run lint

      - name: Type check with TypeScript
        run: npm run typecheck

      - name: Build with Next.js
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
          API_PROXY_TARGET: https://api.example.com
        run: npm run build

      - name: Security audit with npm audit
        run: npm audit --audit-level=high

  repo-hygiene:
    name: Repository Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for gitleaks

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check .env.example exists
        run: |
          [ -f .env.example ] && [ -f apps/api/.env.example ] || \
          (echo ".env.example missing" && exit 1)

      - name: Check for tracked secrets/dumps
        run: |
          ! git ls-tree -r HEAD --name-only | grep -E '\.(dump|env)$|frozen_' || \
          (echo "Tracked secret files found" && exit 1)

      - name: Check OpenAPI types diff
        continue-on-error: true
        run: |
          # Placeholder: Add openapi type generation check when available
          echo "OpenAPI type check (placeholder)"

  status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [backend, frontend, repo-hygiene]
    if: always()
    steps:
      - name: Check CI status
        run: |
          if [[ "${{ needs.backend.result }}" == "failure" || \
                "${{ needs.frontend.result }}" == "failure" || \
                "${{ needs.repo-hygiene.result }}" == "failure" ]]; then
            echo "❌ CI Failed"
            exit 1
          fi
          echo "✅ CI Passed"
