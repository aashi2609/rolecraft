name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # GitHub's bash shell already runs -eo pipefail; declared explicitly so
    # every run step (incl. multi-line) inherits errexit + pipefail.
    shell: bash

jobs:
  backend:
    name: Backend (Python 3.11.9)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        # pgvector image matching Neon major version (PG 18)
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Verify Python version is exactly 3.11.9
        run: |
          cd apps/api
          set -euo pipefail
          actual="$(python --version 2>&1)"
          echo "python --version => $actual"
          test "$actual" = "Python 3.11.9" || {
            echo "::error::Expected Python 3.11.9, got: $actual"
            exit 1
          }

      - name: Print Python version and working directory
        run: |
          python --version
          pwd

      - name: Install dependencies
        run: |
          cd apps/api
          pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          cd apps/api
          ruff check .

      - name: Format check with ruff
        run: |
          cd apps/api
          ruff format --check .

      - name: Type check with mypy (reporting only — non-blocking)
        # mypy: reporting only — continue-on-error is intentional; type
        # coverage is advisory until the codebase is fully annotated.
        # tests/ excluded: duplicate conftest module names break mypy's
        # module mapping (tests/conftest.py vs tests/security/conftest.py).
        continue-on-error: true
        run: |
          cd apps/api
          mypy core services routers models schemas scripts main.py --ignore-missing-imports

      - name: Security audit with pip-audit
        # Explicit ignore list — every entry needs a reason and an expiry.
        # Review by 2026-06-01: upgrade pypdf/fpdf2/pyasn1/starlette/weasyprint/
        # setuptools/python-jose/ecdsa/pytest or re-justify each ignore.
        run: |
          cd apps/api
          pip-audit --desc \
            --ignore-vuln PYSEC-2026-1325 \
            --ignore-vuln GHSA-wqw6-wpr3-45rh \
            --ignore-vuln GHSA-rw7v-4hrq-x6r9 \
            --ignore-vuln PYSEC-2026-2263 \
            --ignore-vuln PYSEC-2026-3457 \
            --ignore-vuln PYSEC-2026-3456 \
            --ignore-vuln PYSEC-2026-3455 \
            --ignore-vuln GHSA-2qm8-x737-gmw5 \
            --ignore-vuln GHSA-fm9c-5rcf-2q5p \
            --ignore-vuln GHSA-mm57-4v3p-rchx \
            --ignore-vuln GHSA-9m75-vc3g-4x39 \
            --ignore-vuln PYSEC-2026-3910 \
            --ignore-vuln PYSEC-2026-3911 \
            --ignore-vuln PYSEC-2026-3913 \
            --ignore-vuln PYSEC-2026-4153 \
            --ignore-vuln PYSEC-2026-4154 \
            --ignore-vuln PYSEC-2026-4160 \
            --ignore-vuln PYSEC-2026-4159 \
            --ignore-vuln PYSEC-2026-4156 \
            --ignore-vuln PYSEC-2026-4155 \
            --ignore-vuln PYSEC-2026-4158 \
            --ignore-vuln PYSEC-2026-4157 \
            --ignore-vuln GHSA-qfv9-64jg-mh7p \
            --ignore-vuln GHSA-7mh2-4gg2-979f \
            --ignore-vuln GHSA-9mx8-4j7g-633p \
            --ignore-vuln GHSA-39mj-jf6j-2qj3 \
            --ignore-vuln GHSA-5hx5-vpf9-5wcv \
            --ignore-vuln GHSA-cgf9-327m-v77c \
            --ignore-vuln GHSA-f54x-cmq8-qg57 \
            --ignore-vuln GHSA-6vvc-x485-93v7 \
            --ignore-vuln GHSA-6c7f-9265-g8fw \
            --ignore-vuln GHSA-jr96-gvgh-j3r4 \
            --ignore-vuln GHSA-gmh7-3g9r-mjh5 \
            --ignore-vuln GHSA-62m5-6wh8-28x7 \
            --ignore-vuln GHSA-42gh-23hr-vphw \
            --ignore-vuln GHSA-x3rh-gjgm-fmqc \
            --ignore-vuln GHSA-4vqv-7265-gm2w \
            --ignore-vuln GHSA-5849-834g-hvw5 \
            --ignore-vuln GHSA-mfr5-77xh-9j7h \
            --ignore-vuln GHSA-cggf-277g-3q54 \
            --ignore-vuln PYSEC-2026-1845 \
            --ignore-vuln PYSEC-2026-4298 \
            --ignore-vuln PYSEC-2022-43012 \
            --ignore-vuln PYSEC-2025-49 \
            --ignore-vuln PYSEC-2026-1918 \
            --ignore-vuln PYSEC-2026-3447 \
            --ignore-vuln GHSA-xmj3-9gf7-h52w \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln PYSEC-2026-249 \
            --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln PYSEC-2026-1942 \
            --ignore-vuln PYSEC-2026-1941 \
            --ignore-vuln PYSEC-2026-2281 \
            --ignore-vuln PYSEC-2026-2280 \
            --ignore-vuln PYSEC-2026-3412 \
            --ignore-vuln PYSEC-2026-3940 \
            --ignore-vuln PYSEC-2026-4311

      - name: Set up test database
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          cd apps/api
          psql -c "CREATE DATABASE test_isolated;"

      - name: Enable pgvector extension
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          psql -d test_db -c "CREATE EXTENSION IF NOT EXISTS vector;"
          psql -d test_isolated -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Alembic single head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
        run: |
          cd apps/api
          set -euo pipefail
          export PYTHONPATH=.
          heads="$(alembic heads)"
          echo "$heads"
          count="$(echo "$heads" | grep -c '(.\+)' || true)"
          test "$count" -eq 1 || { echo "::error::Expected exactly 1 alembic head, got $count"; exit 1; }

      - name: Run Alembic check
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_isolated
        run: |
          cd apps/api
          alembic check

      - name: Run migrations on test database
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_isolated
        run: |
          cd apps/api
          alembic upgrade head

      - name: Run pytest with coverage
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_isolated
          STORAGE_BACKEND: local
          RATE_LIMIT_ENABLED: 'false'
        run: |
          cd apps/api
          set -o pipefail
          pytest tests/ -v --tb=short --durations=15 \
            --cov=. --cov-report=xml --cov-report=term-missing \
            --junit-xml=junit.xml 2>&1 | tee test_output.log

      - name: Fail if junit XML contains skipped tests
        if: always()
        run: |
          cd apps/api
          set -euo pipefail
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          junit = Path("junit.xml")
          if not junit.exists():
              print("::error::junit.xml missing — pytest step did not produce results")
              sys.exit(1)
          root = ET.parse(junit).getroot()
          skipped = sum(int(s.get("skipped", 0)) for s in root.iter("testsuite"))
          skipped += sum(int(tc.get("skipped", 1)) for tc in root.iter("testcase") if tc.find("skipped") is not None)
          print(f"junit skipped count: {skipped}")
          if skipped:
              print(f"::error::{skipped} skipped test(s) — skips are not allowed in CI")
              sys.exit(1)
          PY

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./apps/api/coverage.xml
          flags: backend
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            apps/api/junit.xml
            apps/api/test_output.log
            apps/api/coverage.xml

  frontend:
    name: Frontend (Node 20.19.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint with ESLint
        run: npm run lint

      - name: Type check with TypeScript
        run: npm run typecheck

      - name: Build with Next.js
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
          API_PROXY_TARGET: https://api.example.com
        run: npm run build

      - name: Security audit with npm audit
        run: npm audit --audit-level=high

  repo-hygiene:
    name: Repository Hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for gitleaks

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check .env.example exists
        run: |
          test -f .env.example || test -f .env.local.example || (echo "Root .env.example missing" && exit 1)
          test -f apps/api/.env.example || (echo "Backend .env.example missing" && exit 1)

      - name: Check for tracked secrets/dumps
        run: |
          ! git ls-tree -r HEAD --name-only | grep -E '\.(dump|env)$|frozen_' || \
          (echo "Tracked secret files found" && exit 1)

      - name: OpenAPI type check (placeholder — reporting only)
        # Placeholder step: kept non-blocking until openapi type
        # generation is wired up. Label: openapi-check reporting only.
        continue-on-error: true
        run: |
          echo "OpenAPI type check (placeholder)"

  status:
    name: CI Status
    runs-on: ubuntu-24.04
    needs: [backend, frontend, repo-hygiene]
    if: always()
    steps:
      - name: Check CI status
        run: |
          if [[ "${{ needs.backend.result }}" == "failure" || \
                "${{ needs.frontend.result }}" == "failure" || \
                "${{ needs.repo-hygiene.result }}" == "failure" ]]; then
            echo "❌ CI Failed"
            exit 1
          fi
          echo "✅ CI Passed"
